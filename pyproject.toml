[project]
name = "defi-oracle-vault-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff.lint]
# FURB157: 我们刻意使用 Decimal("0.1") 字符串构造以保证精度，不采用该风格建议。
ignore = ["FURB157"]
